proxy:
  listen_addr: "0.0.0.0:3307"
  metrics_addr: "127.0.0.1:9090"   # "" to disable; exposes /healthz, /metrics, /debug/vars
  max_connections: 1000
  shutdown_timeout: 30s
  # cluster names the database cluster this proxy fronts. When set,
  # every Prometheus metric line is rendered with {cluster="<value>"},
  # so a single dashboard can break stats down per database cluster
  # via a template variable. Empty = no label emitted.
  # cluster: "example-cluster"
  # users defines the credentials the proxy will accept on the inbound
  # handshake. The matched (username, password) pair is also used to
  # authenticate the per-session outbound connection to the backend (and
  # shadow, if shadow mode is on), so per-user GRANTs apply consistently.
  # At least one entry is required; the proxy never synthesizes its own
  # credentials.
  users:
    - username: "app_user"
      password: "app_pw"
    # - username: "ro_user"
    #   password: "ro_pw"
    #
    # Alternative: hashed_password for users whose plaintext is not
    # available — e.g. accounts copied from `mysql.user` or from a
    # ProxySQL `mysql_users` table, which store only the MySQL
    # `*XXXX...` mysql_native_password hash. Works like ProxySQL: the
    # inbound handshake is checked against the hash, and the SHA1
    # stage1 value recovered from the client's reply is used to open
    # the outbound backend (and shadow) connection, so queries forward
    # end to end without a plaintext anywhere. Requires the backend
    # account to use mysql_native_password with the same hash (MySQL
    # 8.4+ disables that plugin by default). Not available for
    # caching_sha2_password accounts.
    # - username: "personal_alice"
    #   hashed_password: "*4DF1D66463C18D44E3B001A8FB1BBFBEA13E27FC"
  # Optional cap on session lifetime — useful for forcing periodic
  # reconnects so existing sessions rebalance onto new backends after
  # autoscaling. After the cap (with ±10% per-session jitter) elapses,
  # the proxy closes the session at the next safe boundary (between
  # commands, only when the backend is not in a transaction). 0 disables.
  # Hot-reloadable.
  # max_session_lifetime: 1h

backend:
  addr: "127.0.0.1:3306"
  db: ""
  # TCP keep-alive on the outbound backend connection. Detects a dead or
  # half-open backend (silent LB/firewall idle drop, peer crash, network
  # partition) so an in-flight read/write fails promptly instead of
  # hanging. Enabled by default; a dead connection is detected after
  # roughly idle + interval*count.
  keepalive:
    enabled: true   # default true; set false to turn off
    idle: 30s       # idle time before the first probe
    interval: 10s   # time between probes
    count: 3        # unacked probes before the connection is declared dead

tls:
  client_side:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""
  backend_side:
    enabled: false
    ca_file: ""
    skip_verify: false

logging:
  enabled: true
  output_dir: "./logs"
  file_prefix: "queries"
  redact_args: false       # set true to replace prepared-stmt bind values with <redacted>
  queue_size: 10000        # async log buffer; overflow → logger_dropped counter
  rotation:
    max_size_mb: 100
    max_age_days: 7
    max_backups: 5
    compress: true

replay:
  mode: "disabled"    # "disabled" | "shadow" | "offline"
  shadow:
    enabled: true           # hot-reloadable: set false to pause shadow sending
    target_addr: "127.0.0.1:3307"
    target_user: "root"
    target_password: ""
    tls:
      enabled: false
      ca_file: ""
      skip_verify: false
    readonly: true          # always enforced — non-SELECT queries are never replayed
    timeout: 5s             # per-query timeout; slow shadows are abandoned
    max_concurrent: 100
    queue_size: 10000       # shadow queue buffer; overflow → shadow_dropped counter
    sample_rate: 1.0        # fraction of queries to shadow (0.0–1.0); cap overhead under load
    # TCP keep-alive on the shadow backend connection (mirrors
    # backend.keepalive). Enabled by default so a dead/half-open shadow
    # target is detected promptly instead of pinning a session goroutine.
    keepalive:
      enabled: true         # default true; set false to turn off
      idle: 30s             # idle before first probe
      interval: 10s         # between probes
      count: 3              # unacked probes before declared dead
    # CIDR filters (hot-reloadable). Empty lists mean "no restriction".
    # Evaluation: exclude wins over allow — a source IP matching any
    # excluded_source_cidrs is never shadowed. If allowed_source_cidrs is
    # non-empty, the source IP must also match one of them.
    #   allowed_source_cidrs:
    #     - "10.0.0.0/8"      # only internal app servers
    #     - "192.168.1.0/24"
    #   excluded_source_cidrs:
    #     - "10.0.5.0/24"     # never shadow DBA hosts
    allowed_source_cidrs: []
    excluded_source_cidrs: []
  offline:
    input_dir: "./logs"
    file_pattern: "queries-*.jsonl"
    target_addr: "127.0.0.1:3308"
    target_user: "root"
    target_password: ""
    tls:
      enabled: false
      ca_file: ""
      skip_verify: false
    speed_factor: 1.0
    concurrency: 10
    checkpoint_file: "./logs/.replay-checkpoint.json"
    auto_delete_completed: false
    scanner_buffer_size_bytes: 1048576  # max single log-line length; bump if queries are huge

comparison:
  output_file: "./logs/diff-report.jsonl"
  ignore_columns: ["updated_at", "created_at"]
  time_threshold_ms: 100
  max_unique_digests: 10000    # cap on unique query patterns tracked
                               # (each entry ≤ ~160 KB; overflow → counter)
  summary_interval: 1h         # shadow-mode periodic summary cadence
                               # (totals + per-digest avg/p95/p99),
                               # logged via slog. Offline replay ignores
                               # this; it prints its summary at
                               # completion regardless. Set negative
                               # (e.g. -1s) to disable the periodic log;
                               # the shadow shutdown summary still fires
                               # either way.
  log_matches: false           # when false (default), only diffs are
                               # written inline; matched comparisons are
                               # represented by the heartbeat below.
                               # Set true to log every comparison
                               # (high QPS = very noisy).
  heartbeat_interval: 1m       # shadow-mode liveness line written to
                               # output_file every tick. Includes
                               # window_total / window_matched /
                               # window_differed since the last
                               # heartbeat. Negative disables.
  # redact_columns: list of columns whose cell_value diff payloads
  # should be masked. The diff record still carries type, column, row
  # index, and timing — only `original` and `replay` are replaced with
  # "<redacted>". Use for security-relevant columns where you need
  # drift visibility but not the values themselves.
  redact_columns:
    # - hashed_password
    # - email
    # - phone_number
  # redact_all_values: global override. When true, every cell_value
  # AND error diff has its values replaced with "<redacted>",
  # regardless of redact_columns. Defense-in-depth fallback for
  # high-sensitivity environments.
  redact_all_values: false
  # upload: copy output_file to GCS when `serve` shuts down, so the
  # report outlives the process and its local disk. The object is
  # gs://<bucket>/<prefix>/<instance>/<file>-<UTC timestamp>.gz.
  # Uses Application Default Credentials (Workload Identity on GKE).
  # Leave bucket empty to disable.
  upload:
    gcs:
      bucket: ""
      prefix: "mysql-interceptor"
      # instance defaults to the hostname (the pod name on Kubernetes).
      # instance: "${POD_NAME}"
    timeout: 20s               # keep shutdown_timeout + this below the
                               # process grace period
  # Queries that match any of these case-insensitive regexes are still
  # recorded in the diff report but marked "ignored" instead of counted
  # as differences. Use for queries that read server-local state and
  # always diverge between MySQL instances.
  ignore_queries:
    - "@@server_uuid"
    - "@@hostname"
    - "@@server_id"
    - "CONNECTION_ID\\s*\\("
    - "LAST_INSERT_ID\\s*\\("
    - "\\bNOW\\s*\\("
    - "\\bCURRENT_TIMESTAMP\\b"
    - "\\bUUID\\s*\\("
  # Re-verify a diff before reporting it. When the shadow target is fed
  # asynchronously (changefeed / replica), a SELECT that runs on the
  # shadow right after the primary can read older data and show up as a
  # diff. With retry enabled, a differing SELECT is held back and run
  # again on the session's shadow connection after `delay`; if it then
  # matches, the comparison is recorded as matched with
  # resolved_by_retry=true (and counted in comparisons_resolved_by_retry),
  # otherwise it is retried up to `max_attempts` times and reported as a
  # diff carrying `retries`. Shadow mode only; SELECT statements only.
  retry:
    max_attempts: 0            # 0 (default) disables retry
    delay: 2s                  # wait before each re-execution; set above
                               # the shadow target's typical lag
    mode: shadow               # shadow: re-run on the shadow only and
                               #   compare with the primary's ORIGINAL
                               #   result (no extra primary load; a row
                               #   the primary updated in between stays a
                               #   diff)
                               # both: also re-run on the primary over a
                               #   per-session verification connection
                               #   and compare the two FRESH results.
                               #   Adds the SELECT again to primary load
                               #   (shadow_retry_primary_queries). Sessions
                               #   that ran SET or created temp tables
                               #   fall back to shadow for that session.
    - "\\bRAND\\s*\\("

bench:
  queries:
    - "SELECT 1"
    - "SELECT * FROM information_schema.tables LIMIT 10"
  concurrency: 4
  iterations: 1000
  warmup_iterations: 50
