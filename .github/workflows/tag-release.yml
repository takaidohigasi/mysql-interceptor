name: Tag release

# Creates the tag named in VERSION when VERSION changes on main, then runs the
# release workflow for it. Release PRs bump VERSION together with CHANGELOG.md.
on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Create tag from VERSION
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.push.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate VERSION
        id: version
        run: |
          tag="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must look like v0.0.16, got '$tag'"
            exit 1
          fi
          # The release notes link to CHANGELOG.md#<tag>, so the section must exist.
          if ! grep -q "<a id=\"$tag\"></a>" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '<a id=\"$tag\"></a>' section for $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Push tag
        id: push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
